  ecma: null
  ecma_level: BASIC-2
  module: files
  kind: semantics
  status: claimed
  claim: "A data creation statement (WRITE, PRINT #) evaluates its operands only in phase 3, after phase 2 has decided that no record exists: when the record is found and the statement carries an IF THERE clause its recovery action is taken without evaluating any operand, so an operand that raises an exception or a function with side effects is not executed; the same holds for a REWRITE with IF MISSING when the record does not exist. When data-found is false the operands are evaluated once, in order."
  tests: [FIL-0340]
  external: []
  covers: [l.7507-7514, l.7516-7524, l.7525-7528, l.8527-8533]
