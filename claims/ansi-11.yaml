# --- Implementation-defined features of chapter 11 (Appendix C)
- id: D-11-1
  clause: "11"
  ecma: "11"
  ecma_level: BASIC-2
  module: files
  kind: implementation-defined
  claim: "The effect of file-organization and record-type combinations beyond those of the core and enhanced modules is implementation-defined."
  value: "Unlisted organization/record-type combinations are accepted and processed according to the record type. STREAM+DISPLAY: PRINT # writes one line per statement, as for SEQUENTIAL+DISPLAY (so PRINT #n: 1, 2, 3 writes ONE line with print zones, 10.3.4.3, and reading it back with READ #n: X into a numeric variable raises 8101, 11.4.5.3 l.8430-8431, because the zone-padded text is not a single numeric-constant), but reading follows the stream rule of 11.4.4.8 (l.8224-8235): INPUT #, READ # and MAT INPUT # take their data from the sequence of data in the file, line boundaries are not significant (a line with too few data does not raise 8012: the next line supplies the rest; only the end of the file raises 8011) and the data left over from the current line are the next file elements; LINE INPUT # and MAT LINE INPUT # return the unread rest of the current line as it is, spaces included, when data are pending, and the next line otherwise; MAT INPUT X(?) takes the pending data of the current line or, if none, the data of the next line that has any. STREAM+NATIVE needs a TEMPLATE like any NATIVE file and follows the same stream rule: there are no records, so READ # takes the next fields of the file whatever the previous statement read, a template longer than the data left raises 8011 at the end of the file, and 8012/8013 never occur. Files written by builds before 2026-11-09 are not read: no released version wrote them."
  tests: [FIL-0152, FIL-0601]
  external: []
  covers: [l.6664-6668]
