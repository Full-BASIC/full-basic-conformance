  module: files
  kind: semantics
  claim: "A channel-expression is a number-sign followed by an index, so a channel number that is not an integer is rounded with INT(X+.5) in OPEN, CLOSE, PRINT, LINE INPUT, ASK, SET and the other file statements: #1.4 and #0.6 are channel 1. The rounded value is then checked against the range of channels: #255.4 is channel 255 and is valid, #255.6 is channel 256 (7001), #0.4 is channel zero (7002) and #-.6 is channel -1 (7001)."
  tests: [FIL-0501, FIL-0502]
  covers: [l.1700-1702, l.6488]
  external: []

