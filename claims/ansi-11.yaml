  ecma: null
  ecma_level: BASIC-2
  module: files
  kind: semantics
  status: claimed
  claim: "ASK #n: KEY on a KEYED file assigns the key of the record identified by the pointer, and the null string when the pointer is at end of file (Table 5) — e.g. after an inexact greater-than search (SET #n: KEY > k$) with no greater key, which sets the pointer to end of file (§11.2.4.1); the null string is also assigned for a non-KEYED file."
  tests: [FIL-0208]
  external: []
  covers: [l.6987-6991, l.7263-7266]
- id: A-11.1.4.9-TR64
  clause: "11.1.4.9"
  ecma: null
  ecma_level: BASIC-2
  module: files
  kind: semantics
  status: claimed
  claim: "On a KEYED file, after a READ # (with or without a record-setter, exact or inexact) the pointer is at the next file-element, so ASK #n: KEY gives the key of the NEXT record in the key sequence (not the one just read) and the null string once the last record has been read; after SET #n: KEY the pointer is at the record found, and ASK KEY gives its key."
  tests: [FIL-0219]
  external: []
  covers: [l.6987-6992, l.7263-7266, l.7529-7541]

