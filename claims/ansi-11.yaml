  module: files
  kind: semantics
  status: claimed
  claim: "On RELATIVE and KEYED files (INTERNAL, NATIVE and DISPLAY), a WRITE or REWRITE stopped by exception 7308 or by an exception while evaluating an operand (the first, a middle one or the last) adds or changes no file-element and leaves no values behind: the next correct WRITE or REWRITE of the channel stores exactly its own values, and the record that failed does not exist (WRITE) or is unchanged (REWRITE)."
