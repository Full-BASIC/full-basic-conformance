  ecma: null
  ecma_level: BASIC-2
  module: files
  kind: semantics
  status: claimed
  claim: "The exceptions of phases 1 and 2 of a WRITE or PRINT # come before the evaluation of the operands: a WRITE on a file opened INPUT is 7302 (also when it carries IF THERE) and a data creation on an existing record without recovery is 7308, whatever the operands are, and in both cases no operand is evaluated and the file does not change."
  tests: [FIL-0341]
  external: []
  covers: [l.7507-7514, l.7516-7524, l.7525-7528, l.7885-7886, l.7907-7909]
