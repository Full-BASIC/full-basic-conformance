  clause: "11.1.4.9"
  ecma: null
  ecma_level: BASIC-2
  module: files
  kind: semantics
  claim: "In a STREAM INTERNAL file, DATUM reports the type of the next datum after the current pointer: after a partial READ of a multi-datum WRITE the pointer is at the next pending value of that WRITE (§11.4.4 l.8056-8062), so DATUM gives its type (NUMERIC/STRING), and NONE at end of file; SET #n: POINTER BEGIN/END repositions the pointer and DATUM follows it."
  tests: [FIL-0195]
  external: []
  covers: [l.6964-6973, l.8056-8062]
- id: A-11.1.4.9-TR48
  clause: "11.1.4.9"
  ecma: null
  ecma_level: BASIC-2
  module: files
  kind: semantics
  status: claimed
  claim: "ASK #n: ZONEWIDTH assigns the current zone width for a DISPLAY file (default 17, or the value of the last SET #n: ZONEWIDTH) and zero for a non-DISPLAY file (Table 5). ASK #n: MARGIN is zero for a non-DISPLAY file as well."
  tests: [FIL-0207]
  external: []
  covers: [l.7028-7029, l.6993-6995]
