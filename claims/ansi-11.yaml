  ecma: null
  ecma_level: BASIC-2
  module: files
  kind: semantics
  status: claimed
  claim: "A WRITE with IF THERE (or a REWRITE with IF MISSING) takes the io-recovery-action when data-found is true (false for REWRITE) whatever the number of values: on a RELATIVE INTERNAL file the recovery was lost after the first value; the file is not changed and the next statement of the channel works."
  tests: [FIL-0313]
  external: []
  covers: [l.7516-7524, l.8527-8533]
