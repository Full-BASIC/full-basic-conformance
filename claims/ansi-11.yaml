  claim: "The io-recovery-action declared by a WRITE or REWRITE is taken or ignored by that statement only: when the statement stops with an exception (in an operand of phase 3, with 7302 in phase 1, or with 8301 in MAT WRITE) a later statement on the channel does not take the old recovery, so a WRITE on an existing record gives 7308, a READ of a missing record gives 7305 and a SET that finds a record continues normally."
