  claim: "ASK #n: MARGIN assigns the current margin of a DISPLAY file (MAXNUM when the record may be of arbitrary length, i.e. no RECSIZE LENGTH and no SET #n: MARGIN, or after SET #n: MARGIN MAXNUM), the RECSIZE LENGTH when the file was opened with one, the value set by SET #n: MARGIN otherwise, and zero for a non-DISPLAY file."
