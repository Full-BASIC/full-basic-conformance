# Claims for chapter 15 (fixed decimal).
- id: A-15.1.2-01
  clause: "15.1.2"
  ecma: "15.1.2"
  ecma_level: BASIC-2
  module: fixed
  kind: syntax
  claim: "An OPTION ARITHMETIC FIXED statement, if present, must be placed on a line numbered lower than any numeric expression or variable reference, or any NUMERIC declare-statement, in the same program unit."
  tests: [FIX-0001]
  external: []
  covers: [l.12145-12148]

- id: A-15.1.2-02
  clause: "15.1.2"
  ecma: "15.1.2"
  ecma_level: BASIC-2
  module: fixed
  kind: syntax
  status: claimed
  claim: "A fixed-declaration, if present, must be placed on a line numbered lower than any reference to the variable or array it declares."
  tests: [FIX-0002]
  external: []
  covers: [l.12150-12152]

- id: A-15.1.2-03
  clause: "15.1.2"
  ecma: "15.1.2"
  ecma_level: BASIC-2
