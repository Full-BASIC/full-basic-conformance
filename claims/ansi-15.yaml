- id: A-15.1.2-06
  clause: "15.1.2"
  ecma: "15.1.2"
  ecma_level: BASIC-2
  module: fixed
  kind: semantics
  claim: "In a fixed-point-size, an omitted fraction-size means zero fraction digits, and an omitted or explicitly zero integer-size means zero integer digits; the size is valid in OPTION, DECLARE and fixed parameters whenever integer-size plus fraction-size does not exceed P."
  tests: [FIX-0035, FIX-0036, FIX-0037, FIX-0038, FIX-0040, FIX-0042, FIX-0043]
  external: []
  covers: [l.12134-12143, l.7446-7447, l.12180-12183, l.12292-12294]

- id: A-15.1.2-07
  clause: "15.1.2"
  ecma: "15.1.2"
  ecma_level: BASIC-2
  module: fixed
  kind: exception
  claim: "A variable, fixed parameter or fixed defined function whose fixed-point-size has zero integer digits cannot hold a value with a nonzero integer part; assigning one raises fatal exception 1011."
  tests: [FIX-0039, FIX-0041, FIX-0044]
  external: []
  covers: [l.7446-7447, l.12296-12298]

- id: A-15.1.3-EX
  clause: "15.1.3"
  ecma: "15.1.3"
  ecma_level: BASIC-2
  module: fixed
  kind: syntax
  claim: "Every declaration form shown in the examples of section 15.1.3, an ARITHMETIC FIXED option followed by NUMERIC fixed-declarations, is accepted and behaves as written."
