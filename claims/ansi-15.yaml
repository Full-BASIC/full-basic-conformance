- id: D-15.2.2-1
  clause: "15.2.2"
  ecma: "15.2.2"
  ecma_level: BASIC-2
  module: fixed
  kind: implementation-defined
  claim: "Whether the ARITHMETIC options of two program-units joined by CHAIN must agree in fixed-point precision or only in type, and whether the numeric parameters of the program-name-line are subject to the ordering rule of OPTION ARITHMETIC FIXED."
  tests: [SEG-0324, SEG-0311, SEG-0312]
  value: "Agreed interpretation of 15.2.2 (decision of the project owner, 2026-11-02): 15.2.2 l.12354-12357 only requires the ARITHMETIC options of the two program-units to agree in type (DECIMAL, NATIVE or FIXED), not in precision, so CHAIN from FIXED*4.2 to FIXED*8.2 executes without exception 4303 (SEG-0324); NATIVE vs DECIMAL still raise 4303 both ways (SEG-0311, SEG-0312). The ordering rule of 15.1.2 l.12145-12148 does not reach the parameters of the program-name-line (the first line), so a FIXED program with numeric program parameters is conforming."
  external: []
  covers: [l.12354-12357, l.12145-12148]

