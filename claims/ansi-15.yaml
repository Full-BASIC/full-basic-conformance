- id: E-1011
  clause: "15.1.5"
  ecma: "15.1.5"
  ecma_level: BASIC-2
  module: fixed
  kind: exception
  claim: "Assigning a numeric value to a fixed-decimal variable, fixed parameter or fixed defined function when the value's integer part needs more digits than the target's integer-size raises fatal exception 1011, an overflow in a fixed decimal assignment."
  tests: [FIX-0024]
  external: []
  covers: [l.12296-12298, l.12420-12423, l.12794]

