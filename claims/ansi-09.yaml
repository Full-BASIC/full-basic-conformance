- id: A-9.2.4.1-15
  clause: "9.2.4.1"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Every statement that assigns to a variable (READ, INPUT, LINE INPUT, FOR, ASK, file READ, substring assignment) acts on the location the parameter denotes: the caller's variable or array element when it was passed by reference."
  tests: [SEG-0172, SEG-0173, SEG-0174, SEG-0176, SEG-0177, SEG-0178, SEG-0179, SEG-0180, SEG-0181]
  covers: [l.4648-4655]
  external: []

- id: A-9.2.4.1-16
  clause: "9.2.4.1"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "When the argument is an expression, assignments of any kind to the parameter act on a location local to the invocation, which later reads of the parameter see, and leave the caller's variable unchanged."
  tests: [SEG-0175]
  covers: [l.4659-4665]
  external: []

- id: A-9.2.4.1-17
  clause: "9.2.4.1"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A parameter received by value is a variable local to the invocation of an internal or external SUB or FUNCTION, and a GOSUB/RETURN inside the procedure does not isolate it: an assignment made to it in the subroutine is still seen after RETURN, for numeric and string parameters and with nested GOSUB."
  tests: [SEG-0334]
  covers: [l.4649-4662, l.4306-4312, l.3678-3716]
  external: []


- id: A-9.1.5-TR90
  clause: "9.1.5"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: exception
  claim: "A string-defined function whose value is longer than its length-max raises fatal exception 1106 and the error is reported on the line of the statement that assigns the value: the DEF line for a one-line DEF, the function-let line for a multi-line FUNCTION, never on line 0."
  tests: [SEG-0395, SEG-0396]
  covers: [l.4421-4423, l.584-588]
  external: []

- id: A-9.2.4.2-TR116
  clause: "9.2.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "The parameters of an EXTERNAL SUB or FUNCTION are names of that program unit, so its internal SUBs and FUNCTIONs and the DEFs of its body read and assign them (an assignment reaches the actual argument, which is passed by reference; an array parameter is used with its elements and bounds); a parameter of the internal routine itself with the same name hides the unit parameter."
  tests: [SEG-0499, SEG-0500, ARR-0311]
  covers: [l.4726-4738, l.4381-4394, l.4647-4653, l.4664-4671]
  external: []

- id: A-9.2.4.2-TR117
  clause: "9.2.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "The arrays that an internal SUB or FUNCTION of an EXTERNAL unit dimensions or declares belong to the unit and to each invocation of it: they exist, with their bounds and without the values of a previous invocation, in the first call of the unit and in every later one, and the internal routine and the body of the unit see the same array."
  tests: [ARR-0312, ARR-0313]
  covers: [l.4726-4738, l.3056-3058]
  external: []

- id: A-9.2.4-TR132
  clause: "9.2.4"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A variable that is a procedure-argument is passed by reference also when the call is made from the body of an EXTERNAL unit and the variable is local to that unit: assigning the procedure-parameter in the internal SUB assigns the variable. A parameter of an EXTERNAL unit whose argument is a literal or an expression is a value local to the invocation of the unit: an internal SUB of the unit sees it and assigns it, and the unit sees the assignment afterwards."
  tests: [SEG-0511, SEG-0512, SEG-0513, SEG-0514]
  covers: [l.4647-4651, l.4726-4738, l.1498-1509, l.8805-8807]
  external: []

- id: A-9.2.2-TR134
  clause: "9.2.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "The detached-handler of an EXTERNAL unit (SUB or FUNCTION) or of an internal SUB of such a unit is part of that program-unit: a CALL in it to an external SUB needs a DECLARE EXTERNAL SUB of the SUB in a lower-numbered line of the same program-unit, and the declare-statements of the main program do not count. The program is rejected when only the main program declares the SUB. The SUB that owns the handler is exempt from this declaration when it calls itself (self-recursion, l.4534-4537; A-9.2.2-TR136)."
  tests: [SEG-0515, SEG-0516, SEG-0517, SEG-0518, SEG-0519]
  covers: [l.4522-4526, l.8805-8807]
  external: []

- id: A-9.2.2-TR136
  clause: "9.2.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "The detached-handler of an internal SUB of the main program may CALL its own SUB (a self-recursive subprogram need not declare itself): the CALL is accepted, with the arguments checked against the parameters of the SUB, and the handler runs when the exception occurs in the SUB."
  tests: [SEG-0520]
  covers: [l.4534-4537, l.8805-8807]
  external: []

- id: A-9.1.2-TR136
  clause: "9.1.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "The detached-handler of an internal FUNCTION of the main program may invoke its own FUNCTION (a self-recursive function need not declare itself), with the arguments checked against the parameters of the FUNCTION."
  tests: [SEG-0521]
  covers: [l.4220-4223, l.8805-8807]
  external: []

- id: A-9.2.2-TR136B
  clause: "9.2.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Each program-unit checks the declare-statements of external SUBs against its own lines: when several EXTERNAL units declare the same SUB, the CALL in the detached-handler of each one is accepted if its own unit declares the SUB in a lower-numbered line, whatever the line of the declare-statement of another unit; it is rejected if its own unit does not declare it, even if another unit does."
  tests: [SEG-0522, SEG-0523]
  covers: [l.4522-4526, l.8805-8807]
  external: []

- id: A-9.1.2-TR137
  clause: "9.1.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A declare-statement written inside a picture-def counts as a declaration of the program-unit of the picture: an EXTERNAL picture, or an internal picture of the main program, may use an external FUNCTION declared with DECLARE EXTERNAL FUNCTION, or a DEF declared with DECLARE DEF, in a lower-numbered line of the picture; a declare-statement that follows the use in the picture does not count and the program is rejected."
  tests: [SEG-0524, SEG-0525, SEG-0526, SEG-0527]
  covers: [l.4201-4205, l.4213-4217]
  external: []

- id: A-9.2.2-TR137
  clause: "9.2.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "An EXTERNAL picture may CALL an external SUB that it declares with DECLARE EXTERNAL SUB in a lower-numbered line of the picture, in its body and in its detached-handler; the declare-statements of the main program do not count for the picture, which is rejected when it declares nothing."
  tests: [SEG-0528, SEG-0529, SEG-0530]
  covers: [l.4522-4526, l.8805-8807]
  external: []

- id: A-9.2.4.2-TR141
  clause: "9.2.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "The name of a parameter is local to each invocation of an internal SUB, also in recursion: when the outermost invocation of a recursive internal SUB is bound by reference to a variable of the caller, the nested invocations whose argument is an expression evaluate it on each entry and read their own parameter, not the variable bound by the first call; only the outermost invocation assigns to that variable."
  tests: [SEG-0540, SEG-0541, SEG-0542]
  covers: [l.4718-4721, l.4660-4668, l.4632-4634]
  external: []

- id: A-9.1.2-TR143
  clause: "9.1.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "The detached-handler of the main program, and that of an internal SUB of the main program, may invoke an external FUNCTION that the main program declares with DECLARE EXTERNAL FUNCTION in a lower-numbered line."
  tests: [SEG-0550]
  covers: [l.4201-4205, l.8805-8807]
  external: []

- id: A-9.2.2-TR143
  clause: "9.2.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A CALL in the detached-handler of the main program, or of an internal SUB of the main program, is checked against the declare-statement of the main program even when another program-unit declares the same SUB at a higher line; a SUB declared only by another unit is rejected."
  tests: [SEG-0551, SEG-0552]
  covers: [l.4522-4526, l.8805-8807]
  external: []

- id: A-9.2.4.1-TR142
  clause: "9.2.4.1"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Arguments are evaluated left to right and a variable argument is passed by reference even when a later argument of the same CALL or DRAW calls a user function (DEF, internal or external FUNCTION): the parameter stays bound to the variable, reads its value and an assignment to the parameter reaches the variable."
  tests: [SEG-0560]
  covers: [l.4649-4655, l.4660-4668]
  external: []

- id: A-9.2.4.2-TR142
  clause: "9.2.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A local variable of an external SUB, FUNCTION or PICTURE that has not been assigned yet and is passed by reference to another subprogram is that same local variable of the invocation: the called subprogram assigns it, and the caller reads the value afterwards without a warning and without touching any other variable of the unit, including in recursion with output parameters."
  tests: [SEG-0561, SEG-0562]
  covers: [l.4726-4733, l.4649-4655, l.4632-4634]
  external: []

- id: A-9.2.4.1-TR146
  clause: "9.2.4.1"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A GOSUB subroutine does not create a scope: a by-value parameter of a CALL, a FUNCTION or a DEF invoked inside it (also nested, from ON GOSUB, or inside an EXTERNAL SUB) takes the value of its argument and the routine reads it, exactly as outside the subroutine."
  tests: [SEG-0570, SEG-0571, SEG-0572]
  covers: [l.3678-3716, l.4649-4668, l.4306-4312]
  external: []

- id: A-9.2.4.1-TR146B
  clause: "9.2.4.1"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "An array is passed by reference to an internal or EXTERNAL SUB or FUNCTION whose name contains one or more underlines, also when the formal array name contains underlines: the routine reads and assigns the elements of the actual array."
  tests: [SEG-0573, SEG-0574, SEG-0575]
  covers: [l.1450-1454, l.4670-4677, l.4306-4312]
  external: []

- id: A-9.2.4.2-TR147A
  clause: "9.2.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "An internal SUB or FUNCTION called from another internal routine sees, under the name of the formal array of the caller, the array of the program-unit that contains both (not the actual array of the caller's invocation): reads and assignments in the callee reach the unit array, also inside an external SUB and when the caller is an internal FUNCTION."
  tests: [SEG-0580, SEG-0581, SEG-0582, SEG-0583]
  covers: [l.4718-4721, l.4734-4738]
  external: []

- id: A-9.2.4.2-TR147B
  clause: "9.2.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A variable of an external SUB, FUNCTION or PICTURE that has not been assigned yet and is passed by reference from an internal routine of that unit is the variable of the invocation of the unit: the called subprogram assigns it (numeric or string), the unit reads the value afterwards, also in recursion with an output parameter."
  tests: [SEG-0584, SEG-0585, SEG-0586]
  covers: [l.4726-4733, l.4649-4655, l.4632-4634]
  external: []

- id: A-9.2.4.2-TR150
  clause: "9.2.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "An array that an external SUB or PICTURE declares for itself is local to each invocation and is distinct from an array outside with the same name, also when that outside array is the actual argument of the very CALL or DRAW (numeric or string arrays, call-site in the main program, in an internal routine or in a GOSUB routine, GOSUB inside the unit, recursion with the local passed down)."
  tests: [SEG-0590, SEG-0591, SEG-0592, SEG-0593, SEG-0594, SEG-0595]
  covers: [l.4718-4721, l.4726-4733, l.4670-4677]
  external: []

- id: A-9.2.2-TR162
  clause: "9.2.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "An internal SUB of the main program with the same name as an external SUB or PICTURE takes precedence over it, for the CALLs of the main program (also from its handlers, from other internal SUBs of the main, with DECLARE SUB and in recursion): the internal SUB is called. A unit that declares the external SUB with DECLARE EXTERNAL SUB calls the external one, whichever unit comes first in the text; DRAW of the external picture does not run the internal SUB. DECLARE EXTERNAL SUB Q together with an internal SUB Q in the same program-unit is still rejected (two subprograms of the name)."
  tests: [SEG-0600, SEG-0601, SEG-0602, SEG-0603, SEG-0604, SEG-0608, SEG-0609]
  covers: [l.4519-4528, l.4108-4109]
  external: []

- id: A-9.1.2-TR162
  clause: "9.1.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "An internal FUNCTION or DEF (numeric or string) of the main program with the same name as an external FUNCTION takes precedence over it inside the main program and is no longer rejected as a duplicate definition; a unit with DECLARE EXTERNAL FUNCTION of the name uses the external function. DECLARE EXTERNAL FUNCTION Q together with an internal FUNCTION or DEF Q in the same program-unit is still rejected (no more than one function of a name per program-unit)."
  tests: [SEG-0605, SEG-0606, SEG-0607, SEG-0610]
  covers: [l.4194-4205]
  external: []

- id: A-9.1.2-TR163
  clause: "9.1.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Within an external program-unit, no more than one function of a given name may be defined or declared: two DEF, two FUNCTION, a DEF and a FUNCTION of the same name, or DECLARE EXTERNAL FUNCTION together with a DEF or FUNCTION of the name, are rejected as a duplicate definition, as in the main program. Internal functions of the same name in different program-units are distinct and accepted."
  tests: [SEG-0611, SEG-0612, SEG-0613, SEG-0614, SEG-0615]
  covers: [l.4196-4199]
  external: []

- id: A-9.2.2-TR164
  clause: "9.2.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "SUB and PICTURE are different classes of routine. A CALL names a subprogram and a DRAW names a picture: a CALL of an internal PICTURE (of the main or of a unit), or a DRAW of an internal SUB or of an external SUB declared with DECLARE EXTERNAL SUB, is rejected when the program is loaded instead of running the routine of the other class. An internal SUB of the main program and an external PICTURE of the same name coexist: CALL runs the SUB and DRAW draws the external picture."
  tests: [SEG-0616, SEG-0617, SEG-0618, SEG-0619, SEG-0620, SEG-0627, SEG-0628]
  covers: [l.4489, l.4522-4532, l.10443, l.10514-10525]
  external: []

- id: A-4.4.2-TR164
  clause: "4.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Inside one program-unit a name designates only one kind of internal routine (SUB, FUNCTION or DEF, HANDLER, PICTURE), and across the program a routine name designates only one of an external FUNCTION, an external SUB, an external PICTURE and the PROGRAM itself: an internal SUB and PICTURE, a PICTURE and FUNCTION, or a SUB and HANDLER of the same name in a program-unit, and an external SUB and PICTURE of the same name, or a PROGRAM named as an external SUB, are rejected. The same name in different program-units (a handler of the main and an external SUB, an internal PICTURE of a unit and an internal SUB of the main) is accepted."
  tests: [SEG-0621, SEG-0622, SEG-0623, SEG-0624, SEG-0625, SEG-0629, SEG-0630]
  covers: [l.1468-1474]
  external: []

- id: A-4.4.2-TR165
  clause: "4.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A simple variable or an array of the main program may have the same name as an internal SUB or internal PICTURE of the main program (also when an external SUB of the name exists, and with DECLARE SUB): the two do not conflict, as they do not inside an external unit. A variable or array with the name of a function of the program-unit is still a conflict."
  tests: [SEG-0631, SEG-0632, SEG-0633, SEG-0634, SEG-0635, SEG-0636]
  covers: [l.1460-1470]
  external: []

- id: A-4.4.2-TR166
  clause: "4.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A simple variable or an array may have the same name as an external SUB or an external PICTURE, in any program-unit (the main program, another external unit, or the external routine itself), whether or not the unit declares or calls it, and the CALL or DRAW of the external routine still works, also with the variable passed by reference. A variable in a unit that does not declare an external FUNCTION of the same name is likewise accepted. A variable or array with the name of a function declared or defined in the program-unit is still a conflict."
  tests: [SEG-0637, SEG-0638, SEG-0639, SEG-0640, SEG-0641, SEG-0642, SEG-0643]
  covers: [l.1460-1474]
  external: []

- id: A-4.4.2-TR167
  clause: "4.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A CALL names a subprogram: a CALL of an internal FUNCTION or DEF (in the main program or in an external unit) is rejected with E-SUBPROGRAM-NOT-DEFINED instead of running the function body without its argument. The name of an external numeric FUNCTION cannot be used as a routine-identifier: it is rejected as the name of the PROGRAM, of an external SUB or PICTURE (with or without uses), of an internal PICTURE and of a detached handler."
  tests: [SEG-0644, SEG-0645, SEG-0646, SEG-0647, SEG-0648, SEG-0649, SEG-0650]
  covers: [l.1472-1477, l.4489, l.4522-4532]
  external: []

- id: A-4.4.2-TR168
  clause: "4.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A formal parameter is a simple variable (or array) of its program-unit (Appendix B row 3), so it may not have the name of a function of that unit: a parameter of an external SUB, PICTURE or FUNCTION named as a function declared or defined in the unit, and the parameter of a function named as the function itself (internal, external or DEF), are rejected with E-IDENTIFIER-CONFLICT."
  tests: [SEG-0651, SEG-0652, SEG-0653]
  covers: [l.1460-1466]
  external: []

- id: A-4.4.2-TR169
  clause: "4.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "An identifier that has the name of an external FUNCTION which the program-unit neither declares nor defines is a variable (or array) of that unit, whatever the first statement that mentions it: a simple variable or string variable read before any assignment gives 0 (or the empty string), and an element of an array parameter of that name is an array element, instead of being taken for a function call and rejected with E-DEFINITION-BEFORE-USE or E-ARGUMENT-COUNT. A variable with the name of a function declared or defined in the unit is still an E-IDENTIFIER-CONFLICT."
  tests: [SEG-0654, SEG-0655, SEG-0656, SEG-0657, SEG-0658, SEG-0659]
  covers: [l.1460-1466, l.1786-1789]
  external: []

- id: A-9.1.2-TR170
  clause: "9.1.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Two external FUNCTION definitions of the same name are rejected with E-DUPLICATE-DEFINITION whatever their parameters (none, numeric or string function, used or not). A CALL of a name that is no subprogram (undefined, a detached handler, or a name for which only the string function exists) is rejected with E-SUBPROGRAM-NOT-DEFINED instead of an error that quotes the internal label."
  tests: [SEG-0660, SEG-0661, SEG-0662, SEG-0663, SEG-0664, SEG-0665]
  covers: [l.4193-4194, l.4489]
  external: []

- id: A-9.2.2-TR171
  clause: "9.2.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A channel-number formal parameter (SUB W(#2), PICTURE P(#2)) only accepts a channel-expression (#n, #K, #K + 1) as argument, and a numeric parameter does not accept a channel-expression: a number or a numeric variable passed to a channel-number parameter, a string passed to it, or a channel-expression passed to a numeric parameter is rejected with E-TYPE-MISMATCH when the program is loaded, for external and internal SUBs and for pictures called with DRAW. The legal passing of channels is unchanged."
