  clause: "9.3.5"
  ecma: "9.3.5"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "CHAIN passing numeric parameters between two FIXED units with different fixed-point sizes executes without exception: only the ARITHMETIC type must agree (15.2.2 l.12354-12357, 'both be DECIMAL or NATIVE or FIXED'), not the precision; the program-name-line parameters do not trigger the ordering rule of 15.1.2 l.12145-12148 (agreed interpretation of 15.2.2)."
