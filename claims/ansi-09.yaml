  claim: "CHAIN passing numeric parameters between program-units whose ARITHMETIC options differ in type (DECIMAL vs NATIVE vs FIXED; a unit without an ARITHMETIC option is DECIMAL, 5.6.4 l.2234-2236) ends the run with fatal exception 4303; with no numeric parameters passed (no WITH, or only string arguments) there is no 4303 even if the ARITHMETIC types differ (9.3.5 l.4918-4920: only when numeric parameters are passed)."
