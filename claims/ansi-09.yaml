  value: "The interpreter reports them itself (as the chained-from side) as FATAL exceptions localized at the CHAIN statement; they are NOT interceptable by a WHEN handler of the chained-from program. STD §9.3.6 l.4927-4932 allows the chained-from program, the chained-to program or an intermediate system program to report them, so no WHEN interception is promised; this implementation chooses the interpreter, fatal."
  external: []
  covers: [l.4927-4932]

