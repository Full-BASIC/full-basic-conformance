# Enhancements over the standard. The standard requires them to be documented
# (2.2 (9), l.553-556). A program that uses one of them is neither a conforming
# nor a portable program. ecma: null — ECMA-116 does not define these constructs either.
- id: A-ENH-1
  clause: "6.1"
  ecma: null
  module: core
  kind: semantics
  status: claimed
  claim: "A unary sign is accepted right after a binary operator in a numeric expression (PRINT 2*-3 prints -6; also 1 - -3 = 4, - -3 = 3, 3 / +3 = 1). The sign applies to the operand that follows; the exponent still takes no sign (2^-1 is a syntax error)."
  tests: [ENH-0001]
  covers: []
  external: []

- id: A-ENH-2
  clause: "6.1"
  ecma: null
  module: core
  kind: semantics
  status: claimed
  claim: "A program line holding only a line number (15, with neither REM nor a tail comment) is accepted as an empty line that does nothing; execution continues with the next line. The conforming form is 15 ! comment."
  tests: [ENH-0002]
  covers: []
  external: []

- id: A-ENH-3
  clause: "6.1"
  ecma: null
  module: graphics
  kind: semantics
  status: claimed
  claim: "In PLOT TEXT and GET POINT the initial-point may omit the comma before AT (PLOT TEXT AT 0.2, 0.7: \"HI\"; GET POINT AT 0.5, 0.5: X, Y gives X = 0.5, Y = 0.5); it behaves exactly as with the comma."
  tests: [ENH-0003]
  covers: []
  external: []

- id: A-ENH-4
  clause: "6.1"
  ecma: null
  module: files
  kind: semantics
  status: claimed
  claim: "SET #n: POINTER RECORD r and SET #n: POINTER KEY k$ are accepted and position the pointer exactly like the conforming enhanced setters SET #n: RECORD r and SET #n: KEY k$ (a following READ #n returns that record)."
  tests: [ENH-0004]
  covers: []
  external: []

- id: A-ENH-5
  clause: "6.1"
  ecma: null
  module: files
  kind: semantics
  status: claimed
  claim: "REPLACE #n, RECORD r: item and MAT REPLACE #n, RECORD r: array are accepted and replace an existing record exactly like REWRITE / MAT REWRITE, including the phase-1 exceptions (7320 fatal on channel 0, 7322 fatal if the file is not OUTIN)."
  tests: [ENH-0005]
  covers: []
  external: []

- id: A-ENH-6
  clause: "6.1"
  ecma: null
  module: files
  kind: semantics
  status: claimed
  claim: "NEXT #n advances the file pointer like SET #n: POINTER NEXT, and NEXT #n, setter positions the pointer like SET #n: <setter>; it does not collide with NEXT control-variable of a FOR loop."
  tests: [ENH-0006]
  covers: []
  external: []

- id: A-ENH-7
  clause: "6.1"
  ecma: null
  module: files
  kind: semantics
  status: claimed
  claim: "RANDOM #n RECORD k (without comma) positions the pointer at record k of a RELATIVE file, so a following READ #n returns that record; only RECORD is admitted as the argument."
  tests: [ENH-0007]
  covers: []
  external: []

- id: A-ENH-8
  clause: "6.1"
  ecma: null
  module: files
  kind: semantics
  status: claimed
  claim: "RENAME a$ TO b$ renames a file (7305 if the source does not exist, 7308 if the target already exists); after RENAME \"a.dat\" TO \"b.dat\" the content is readable under the new name."
  tests: [ENH-0008]
  covers: []
  external: []

- id: A-ENH-9
  clause: "9.2.6"
  ecma: null
  module: core
  kind: semantics
  status: claimed
  claim: "An internal SUB may be called before its definition, with no DECLARE SUB anywhere (100 CALL S / ... / 110 SUB S ... runs and prints; §9.2.6 l.4771-4773 lets an implementation accept an internal subprogram referenced before its definition). The portable conforming form is still DECLARE SUB before the first reference (SEG-0251)."
  tests: [SEG-0250]
  covers: [l.4771-4773]
  external: []

- id: A-ENH-10
  clause: "6.4"
  ecma: null
  module: core
  kind: semantics
  status: claimed
  claim: "UCASE$(s$) and LCASE$(s$) return s$ with every letter converted to upper or lower case, including the Latin-1 letters (a-grave to thorn pair with A-grave to THORN, except the multiplication and division signs); sharp s and y-diaeresis have no one-character counterpart and stay unchanged."
  tests: [ENH-0009]
  covers: []
  external: []

- id: A-ENH-11
  clause: "4.2"
  ecma: null
  module: core
  kind: semantics
  status: claimed
  claim: "Each external procedure keeps its own line-number sequence: an external unit may start below the end-line of the main program (120 END followed by 50 EXTERNAL SUB S) and may repeat line numbers used by the main program or by other units; order and uniqueness are still checked inside each program-unit and among the headers of the external units, and a line-number reference always reaches the line of its own unit (A-4.2.2-TR156). A conforming program uses unique line numbers in ascending order over the whole program."
  tests: [ENH-0010]
  covers: []
  external: []
