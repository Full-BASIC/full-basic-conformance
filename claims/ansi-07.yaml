- id: A-7.1.4-06
  clause: "7.1.4"
  ecma: "7.1.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "MAXSIZE of an array that was never resized is the product of its declared dimension sizes."
