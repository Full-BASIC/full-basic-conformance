# 7.1.4: MAXSIZE is the size permitted by the array declaration, not the current size.
- id: A-7.1.4-01
  clause: "7.1.4"
  ecma: "7.1.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "After MAT A = ZER(3) on an array declared with ten elements, MAXSIZE(A) is still ten and SIZE(A) is three."
  tests: [ARR-0101]
  covers: [l.3077-3079]
  external: []
- id: A-7.1.4-02
  clause: "7.1.4"
  ecma: "7.1.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "MAXSIZE of an array resized by MAT READ is the size given in its declaration."
  tests: [ARR-0102]
  external: []
- id: A-7.1.4-03
  clause: "7.1.4"
  ecma: "7.1.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "MAXSIZE of an array resized by MAT INPUT is the size given in its declaration."
  tests: [ARR-0103]
  external: []
- id: A-7.1.4-04
  clause: "7.1.4"
  ecma: "7.1.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
