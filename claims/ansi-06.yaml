# Claims for chapter 6 (strings).
- id: A-6.1.2-01
  clause: "6.1.2"
  ecma: "6.1.2"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "The length of a string constant is capped only by the implementation-defined limit on characters before an end-of-line, and that limit must be at least 132."
  tests: [STR-0001]
  external: []
  covers: [l.2349]

- id: A-6.1.3-EX
  clause: "6.1.3"
  ecma: "6.1.3"
  ecma_level: BASIC-1
  module: core
  kind: syntax
  claim: "The examples of section 6.1.3 show plain constants, numeric-looking text and a constant with an embedded doubled quote."
  tests: [STR-0002]
  external: []
  covers: [l.2354-2359]

- id: A-6.1.4-01
  clause: "6.1.4"
  ecma: "6.1.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "The value of a string constant is exactly the run of characters found between its opening and closing quotation marks."
  tests: [STR-0003]
  external: []
  covers: [l.2362]

- id: A-6.1.4-02
  clause: "6.1.4"
  ecma: "6.1.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Inside a string constant, two adjacent quotation marks stand for a single quotation-mark character."
  tests: [STR-0004]
  external: []
  covers: [l.2365]

- id: A-6.1.4-03
  clause: "6.1.4"
  ecma: "6.1.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Spaces inside a constant, even trailing ones, are part of its value; a constant made of just two quotation marks is the empty string; upper- and lower-case letters are distinct."
  tests: [STR-0005]
  external: []
  covers: [l.2366-2368]

- id: A-6.1.6-01
  clause: "6.1.6"
  ecma: "6.1.6"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Because a physical line must hold at least 132 characters, a string constant must be allowed to reach at least 129 characters."
  tests: [STR-0006]
  external: []
  covers: [l.2386-2387]

- id: A-6.2.3-EX
  clause: "6.2.3"
  ecma: "6.2.3"
  ecma_level: BASIC-1
  module: core
  kind: syntax
  claim: "The examples of section 6.2.3 illustrate simple variables, subscripted array elements and substring-qualified references."
  tests: [STR-0007]
  external: []
  covers: [l.2417-2424]

- id: A-6.2.4-01
  clause: "6.2.4"
  ecma: "6.2.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A string variable belongs to the program unit in which it appears; if it is a parameter of an internal procedure, it belongs to that procedure definition instead."
  tests: [STR-0008]
  external: []
  covers: [l.2439-2441]

- id: A-6.2.4-02
  clause: "6.2.4"
  ecma: "6.2.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Subscripts of a string-array element must lie inside the declared bounds of the array."
  tests: [STR-0009]
  external: []
  covers: [l.2446]

- id: A-6.2.4-03
  clause: "6.2.4"
  ecma: "6.2.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A$(M:N) selects the characters from position M through position N of A$, with positions counted from the left starting at one."
  tests: [STR-0010]
  external: []
  covers: [l.2451-2454]

- id: A-6.2.4-04
  clause: "6.2.4"
  ecma: "6.2.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Substring indices outside 1..LEN are clamped without any exception: M becomes MAX(M,1) and N becomes MIN(N,LEN(A$))."
  tests: [STR-0011]
  external: []
  covers: [l.2455-2456]

- id: A-6.2.4-05
  clause: "6.2.4"
  ecma: "6.2.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "When M is still greater than N after clamping, the substring is the empty string sitting just before the Mth character, or right after the end of the string when M is past its length."
  tests: [STR-0012]
  external: []
  covers: [l.2457-2459]

- id: D-6.2-1
  clause: "6.2"
  ecma: "6.2"
  ecma_level: BASIC-1
  module: core
  kind: implementation-defined
  claim: "Value held by every string variable when execution begins, before any assignment."
  value: "Null string: reading a string variable before assignment raises nonfatal 3102 (catchable); uncaught, a warning is issued and the value used is the null string (LEN 0)."
  tests: [STR-0013]
  external: []
  covers: [l.2466]

- id: D-6.2-2
  clause: "6.2"
  ecma: "6.2"
  ecma_level: BASIC-1
  module: core
  kind: implementation-defined
  claim: "Default maximum length of a string variable that has no declared length limit (the default string length limit, at least 132)."
  value: "The effective limit of 1E9 characters (one limit for every string): MAXLEN of an undeclared string variable returns 1000000000, above the required minimum of 132. A string expression whose result would be longer raises the fatal 1051 (REPEAT$, concatenation, substring assignment; E-1051) and a string-array expression the fatal 1052 (MAT concatenation, 7.3.5; E-1052); the length is checked before the string is built."
  tests: [STR-0014, STR-0091]
  external: []
  covers: [l.2895-2896]

- id: E-2001
  clause: "6.2.5"
  ecma: "6.2.5"
  ecma_level: BASIC-1
  module: core
  kind: exception
  claim: "Evaluating a string-array element whose subscript falls outside the declared bounds raises fatal exception 2001, which a handler can intercept."
  tests: [STR-0015]
  external: []
  covers: [l.2471, l.12827]

- id: A-6.3.2-01
  clause: "6.3.2"
  ecma: "6.3.2"
  ecma_level: BASIC-1
  module: core
  kind: syntax
  claim: "The arguments of a string function call must match in number and type the parameters of that function's definition, and those of an implementation-supplied string or string-valued function (LEN, POS, REPEAT$, CHR$, ...) must match the description of 6.4.4; a mismatch is rejected before the program runs."
  tests: [STR-0016, STR-0017, STR-0071, STR-0072, STR-0073]
  external: []
  covers: [l.2514-2516]

- id: A-6.3.2-02
  clause: "6.3.2"
  ecma: "6.3.2"
  ecma_level: BASIC-1
  module: core
  kind: syntax
  claim: "An array passed to a string function must have as many dimensions as the corresponding parameter."
  tests: [STR-0018]
  external: []
  covers: [l.2517]

- id: A-6.3.2-03
  clause: "6.3.2"
  ecma: "6.3.2"
  ecma_level: BASIC-1
  module: core
  kind: syntax
  claim: "Every string function used in a program unit must be either supplied by the implementation or defined or declared in a lower-numbered line of the same unit before its first use."
  tests: [STR-0019, STR-0020]
  external: []
  covers: [l.2519-2521]

- id: A-6.3.3-EX
  clause: "6.3.3"
  ecma: "6.3.3"
  ecma_level: BASIC-1
  module: core
  kind: syntax
  claim: "The examples of section 6.3.3 show concatenations mixing variables, substring-qualified elements and constants."
  tests: [STR-0021]
  external: []
  covers: [l.2526-2532]

- id: A-6.3.4-01
  clause: "6.3.4"
  ecma: "6.3.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "The value of a string expression is the concatenation of the values of its primaries, in the order they appear."
  tests: [STR-0022]
  external: []
  covers: [l.2535-2537]

- id: A-6.3.4-02
  clause: "6.3.4"
  ecma: "6.3.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  status: claimed
  claim: "The primaries of a string expression are evaluated from left to right."
  tests: [STR-0023]
  external: []
  covers: [l.2540-2541]

- id: A-6.3.4-03
  clause: "6.3.4"
  ecma: "6.3.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Within each primary, subscripts are evaluated first, then substring qualifiers, then the primary's own value."
