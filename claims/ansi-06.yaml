  external: []
  covers: [l.2541-2543]

- id: A-6.3.4-04
  clause: "6.3.4"
  ecma: "6.3.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Calling a string function substitutes the argument values for the parameters of its defining algorithm, and the resulting scalar string takes the place of the call in the expression."
  tests: [STR-0025]
  external: []
  covers: [l.2546-2550]

- id: E-1051
  clause: "6.3.5"
  ecma: "6.3.5"
  ecma_level: BASIC-1
  module: core
  kind: exception
  claim: "Evaluating a string expression whose result is longer than the maximum string length of the implementation raises fatal exception 1051 instead of truncating the result. FullBASIC's maximum is 1E9 characters; REPEAT$ and concatenation are the expressions that can reach it."
  tests: [STR-0091]
  external: []
  covers: [l.2556, l.12796]

- id: A-6.4.2-TR89
