  kind: syntax
  claim: "The argument of MAXLEN must be a simple string variable or a string array (production 3 of 6.4.2); a string constant, an element of an array, a substring, a parenthesized variable or any other string expression is rejected before the program runs, while a simple variable, an array and a formal parameter are accepted."
  tests: [STR-0074, STR-0075, STR-0076, STR-0077]
  external: []
  covers: [l.2583-2586]

