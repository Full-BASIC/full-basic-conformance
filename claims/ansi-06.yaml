- id: D-6.6-2
  clause: "6.6"
  ecma: "6.6"
  ecma_level: BASIC-1
  module: core
  kind: implementation-defined
  claim: "Maximum length of a declared string variable that has no length-max (the implementation-defined default)."
  value: "The effective limit of 1E9 characters: MAXLEN of a declared variable without length-max returns 1000000000, above the required 132. A length-max above that limit (DECLARE STRING A$*2000000000, also in a string-type, a string array, a DEF or a FUNCTION) is rejected at load with E-STRING-LENGTH-MAX-TOO-LARGE, because the length-max guarantees that values of that length can be stored (6.6.4 l.2886-2896; decision of the project owner, 2026-11-12; measured with the CLI)."
  tests: [STR-0060, STR-0095]
  external: []
  covers: [l.2888-2896]

