  ecma: "13.1.3, 13.2.3"
  ecma_level: Graphics
  module: graphics
  kind: syntax
  claim: "The examples WINDOW, VIEWPORT, CLIP, LINE STYLE and TEXT COLOR of 13.1.3 and 13.2.3 are set-objects; written without SET they are not statements and are rejected."
