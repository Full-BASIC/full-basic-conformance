# Claims for the ECMA-116 (BASIC) examples, converted to FBCS programs.
# `covers` cites the line(s) of the ECMA-116 transcription the examples were taken
# from (not distributed). `clause` is the equivalent ANSI X3.113-1987 clause, `ecma`
# the ECMA-116 clause of the examples section.

# --- 4.2.3 program-name-line (l.1211-1218). No FBCS program is possible: the
# interpreter requires the PROGRAM line to be the first line of the file, which
# is incompatible with the leading FBCS REM header. Verified by hand with the
# CLI: `PROGRAM Graphic` runs; `PROGRAM Graphic(Gs, Y)` raises 4301 at line 0
# (implementation-defined per ECMA 4.2.4).
- id: A-ECMA-01
  clause: "4.2.2"
  ecma: "4.2.3"
  ecma_level: BASIC-2
  module: core
  kind: syntax
  status: pending
  claim: "A program-name-line with a parameter list is part of the syntax; executing such a program in isolation is implementation-defined (4301 here)."
  tests: []
  covers: [l.1211-1218]
  note: "No FBCS program possible (PROGRAM must be the first line, before the FBCS REM header). Hand-verified with the CLI."

