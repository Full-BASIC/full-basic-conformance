# --- Erratum: the ECMA-116 Appendix (syntax summary, l.12142-12144) defines
# print-control-item with enhanced-record-setter; the body of 11.3.2
# (l.6854) and ANSI (l.7392-7394) do not. The interpreter follows the body.
- id: A-ECMA-errata-01
  clause: "11.3.2"
  ecma: "11.3.2 (body) vs Appendix (l.12143)"
  ecma_level: BASIC-2
  module: files
  kind: semantics
  claim: "A KEY record-setter is not allowed inside a PRINT # print-control (the ECMA appendix admits it, the body of 11.3.2 and the ANSI do not); this interpreter rejects it."
  tests: [ECMA-0105]
  covers: [l.6854, l.12142-12144]
  note: "Erratum of ECMA-116: print-control-item = core-record-setter / enhanced-record-setter / ... in the appendix (l.12143) but not in 11.3.2 production 4 (l.6854); ANSI l.7393-7394 agrees with the body. REJECT pins the rejection of PRINT #3, KEY \"a\": 1."

# --- ECMA 3.2.19 reserved words (l.890-920): in BASIC-2 the reserved set is
# the no-argument function names, CON/IDN/ZER/NUL$ and NOT, ELSE, PRINT, REM.
- id: A-ECMA-reserved-01
  clause: "3.2"
  ecma: "3.2.19"
  ecma_level: BASIC-2
  module: core
  kind: syntax
  claim: "Every BASIC-2 reserved word of ECMA 3.2.19 (no-argument function names, CON, IDN, ZER, NUL$, NOT, ELSE, PRINT, REM) is rejected as an identifier."
  tests: [ECMA-0106, ECMA-0107, ECMA-0108, ECMA-0109, ECMA-0110, ECMA-0111, ECMA-0112, ECMA-0113, ECMA-0114, ECMA-0115, ECMA-0116, ECMA-0117, ECMA-0118, ECMA-0119, ECMA-0120, ECMA-0121, ECMA-0122, ECMA-0123]
  covers: [l.890-920]

- id: A-ECMA-reserved-02
  clause: "3.2"
  ecma: "3.2.19"
  ecma_level: BASIC-2
  module: core
  kind: syntax
  claim: "Keywords that ECMA BASIC-2 does not reserve (GO, DO, MAT, THEN) are accepted as identifiers."
  tests: [ECMA-0124]
  covers: [l.890-920]

# --- The examples of 13.1.3 and 13.2.3 are set-objects: with SET they are accepted
