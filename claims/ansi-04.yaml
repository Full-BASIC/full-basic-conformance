- id: A-4.2.2-TR153
  clause: "4.2.2"
  ecma: "4.2.2"
  ecma_level: BASIC-1
  module: core
  kind: syntax
  claim: "The lines of a program occur in ascending line-number order and each line number is defined once, over the whole program and not only at the top level of the main program: a repeated or out-of-order line number inside the body of a for-block, do-block, if-block branch, case-block or when-block, inside a separate handler, inside an internal procedure, or or inside the body of an external program-unit, is rejected when the program is loaded. Order and uniqueness are checked within each program-unit (the main program with its internal procedures, and each external unit on its own, header and end-line included: see A-4.2.2-TR156); repeated numbers BETWEEN units, and a unit numbered below the end of the main program, are accepted as a documented enhancement (A-ENH-11; owner's decisions of 2026-11-06 and 2026-11-10)."
  tests: [PRG-0085, PRG-0086, PRG-0087, PRG-0088, PRG-0089, PRG-0090, PRG-0091, PRG-0092, PRG-0093, PRG-0094]
  covers: [l.1312-1320]
  external: []

- id: A-4.2.2-TR156
  clause: "4.2.2"
  ecma: "4.2.2"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Each program-unit has its own sequence of line numbers: the main program with its internal procedures and separate handlers, and each external procedure on its own. The header line and the end-line of an external procedure belong to its own sequence, so a body line numbered below its header, above its end-line, or equal to either is rejected at load (a SUB, a FUNCTION and a PICTURE alike). Line numbers may be repeated between program-units, but the headers of the external units are not repeated nor put out of order among themselves. A reference to a line number (GOTO, GOSUB, ON GOTO, ON GOSUB, IF ... THEN n, READ ... IF MISSING THEN n, the exception handler lines and RETRY) always reaches the line of its own program-unit, and is rejected when that unit has no such line, even if another unit has it."
  tests: [PRG-0170, PRG-0171, PRG-0172, PRG-0173, PRG-0174, PRG-0175, PRG-0176, PRG-0177, PRG-0178, PRG-0179, PRG-0180, PRG-0181, PRG-0182, PRG-0183, PRG-0184, PRG-0185, PRG-0186, PRG-0187, PRG-0188, PRG-0189, PRG-0190]
  covers: [l.1312-1320]
  external: []

- id: A-4.2.2-TR157
  clause: "4.2.2"
  ecma: "4.2.2"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "The data-statements, image-lines and template-statements of a program-unit are indexed by the line number of THEIR program-unit, so that program-units may repeat their line numbers: RESTORE n goes to the first datum of the DATA of line n of its own unit, PRINT USING n takes the image-line n of its own unit (also when the PRINT USING is written before the IMAGE), and WITH n of a file statement takes the template-statement n of its own unit (also when it is written before the TEMPLATE), whatever the number of units that repeat the number and the order in which they are translated. A diagnostic that names a line of the program (for instance the control-transfer rule of 12.1.2) names the number the user wrote and never the internal per-unit key."
  tests: [PRG-0191, PRG-0192, PRG-0193, PRG-0194, PRG-0195, PRG-0196, PRG-0197]
  covers: [l.1317-1320]
  external: []
