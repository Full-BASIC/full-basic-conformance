  claim: "A line that holds only a line number and a tail-comment (a null-statement, `30 ! text`) is a valid remark-line wherever a remark-line is allowed: between the END line and an external procedure, between two external procedures, and between a SELECT CASE line and its first CASE line, exactly like a REM line."
