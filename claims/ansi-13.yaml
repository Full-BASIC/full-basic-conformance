  clause: "13.1.4"
  ecma: "13.1.4"
  ecma_level: Graphics
  module: graphics
  kind: semantics
  claim: "SET WINDOW sets the window edges: the four parameters give the edges in problem coordinates, left first, then right, then bottom, then top, and the window starts as (0,1,0,1)."
