  kind: implementation-defined
  claim: "How the program selects a particular graphic display device is left to the implementation (Appendix C, subsection 13.1)."
  tests: [GFX-0117]
  value: "One implicit graphics workstation (channel #0); per input class device numbers start at 1 (ASK MAX POINT/MULTIPOINT/CHOICE/VALUE DEVICE = 1,2,3,4); no statement selects a display device. ASK DEVICE SIZE gives 1 1 OTHER and the initial device viewport is 0 1 0 1; there is no pixel reading, so ASK PIXEL SIZE gives 0 0 and ASK PIXEL VALUE -1 (measured with the CLI)."
