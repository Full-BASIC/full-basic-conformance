  clause: "13.1.4"
  ecma: "13.1.4"
  ecma_level: Graphics
  module: graphics
  kind: semantics
  claim: "SET DEVICE WINDOW sets the device window edges in normalized device coordinates, left, right, bottom, top, each within [0,1] with left below right and bottom below top, starting as (0,1,0,1); output outside it is always clipped and the display is cleared when it is not already clear."
