  ecma: "13.1.4"
  ecma_level: Graphics
  module: graphics
  kind: semantics
  claim: "SET VIEWPORT sets the viewport edges in normalized device coordinates, left, right, bottom, top in that order; each lies in [0,1] with left below right and bottom below top, and the viewport starts as (0,1,0,1)."
