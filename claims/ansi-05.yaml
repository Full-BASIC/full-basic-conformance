  value: "Under DECIMAL every numeric function (SQR, EXP, LOG, LOG10, LOG2, SIN, COS, TAN, SEC, CSC, COT, ATN, ANGLE, ASIN, ACOS, SINH, COSH, TANH) and the power operator are computed in decimal with 34 working digits and rounded once to the 18-digit result, so each is the true value rounded to 18 digits (error at most 5 units in the 19th digit, the 5.6.4 bound for m = 17; measured on 2026-11-08); under NATIVE they are computed in binary64 and quantized to 8 significant digits; values print with 8 significant digits (d = 8, D-10.3-2)."
  external: []
  covers: [l.2058]

