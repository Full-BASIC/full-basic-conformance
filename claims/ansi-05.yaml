- id: D-5.4-1
  clause: "5.4"
  ecma: "5.4"
  ecma_level: BASIC-1
  module: core
  kind: implementation-defined
  claim: "The accuracy with which built-in numeric functions are evaluated (Appendix C, subsection 5.4) is chosen by the implementation."
