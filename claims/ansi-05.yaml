# Claims for chapter 5 (numbers: constants, variables, expressions, functions, arithmetic and angle).
# E-1001 and E-2001 already exist (ansi-15.yaml, ansi-06.yaml) and cover the chapter-5
# Table 9 lines l.12782 and l.12827; the chapter-5 exception sections are covered here
# by A-5.1.5-EXC and A-5.2.5-EXC.

# --- 5.1 Numeric constants
- id: A-5.1.3-EX
  clause: "5.1.3"
  ecma: "5.1.3"
  ecma_level: BASIC-1
  module: core
  kind: syntax
  claim: "All constant forms exemplified in section 5.1.3 (implicit- and explicit-point forms, scaled forms with an E exponent, with or without a sign) are accepted as numeric constants."
  tests: [NUM-0001]
  external: []
  covers: [l.1603-1615]

- id: A-5.1.4-01
  clause: "5.1.4"
  ecma: "5.1.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A numeric constant may carry any number of digits, and the implementation keeps either its exact value or that value rounded to the implementation's own precision."
  tests: [NUM-0002]
  external: []
  covers: [l.1624]

- id: A-5.1.4-02
  clause: "5.1.4"
  ecma: "5.1.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "The precision kept for numeric constants is at least ten significant decimal digits while DECIMAL arithmetic is in force (the default; NUM-0003 keeps 1.23456789012345 within 5E-12) and at least six while NATIVE is in force (NUM-0082: 1/3 within 5E-7 under OPTION ARITHMETIC NATIVE)."
  tests: [NUM-0003, NUM-0082]
  external: []
  covers: [l.1626]

- id: A-5.1.4-03
  clause: "5.1.4"
  ecma: "5.1.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A nonzero constant whose magnitude falls below the machine infinitesimal is replaced by zero."
  tests: [NUM-0004]
  external: []
  covers: [l.1633]

- id: A-5.1.5-EXC
  clause: "5.1.5"
  ecma: "5.1.5"
  ecma_level: BASIC-1
  module: core
  kind: exception
  claim: "A numeric constant whose magnitude is larger than MAXNUM is reported as the fatal overflow exception 1001 (EXTYPE 1001); the Table 9 entry is covered by E-1001."
  tests: [NUM-0005]
  external: []
  covers: [l.1635, l.1640]

- id: E-1501
  clause: "5.1"
  ecma: "5.1"
  ecma_level: BASIC-1
  module: core
  kind: exception
  claim: "A nonzero numeric constant below the machine infinitesimal may additionally be reported as the nonfatal underflow exception 1501 (EXTYPE 1501), with the value set to zero and execution continuing."
  tests: [NUM-0006]
  external: []
  covers: [l.1633, l.1644-1647, l.12815]

- id: D-5.1-1
  clause: "5.1"
  ecma: "5.1"
  ecma_level: BASIC-1
  module: core
  kind: implementation-defined
  claim: "The precision and the range kept for numeric constants (Appendix C, subsection 5.1) are chosen by the implementation, within the minimums fixed by section 5.1.4."
  tests: [NUM-0007]
  value: "Numeric constants are held as exact decimals up to 18 significant digits (printed with 8 significant digits (d = 8, D-10.3-2) under DECIMAL and NATIVE alike); magnitude range EPS(0)=2.2250738585073E-308 to MAXNUM=1.7976931348623157E+308 under DECIMAL (D-5.4-2)."
  external: []
  covers: [l.1626, l.1631]

# --- 5.2 Numeric variables
- id: A-5.2.2-01
  clause: "5.2.2"
  ecma: "5.2.2"
  ecma_level: BASIC-1
  module: core
  kind: syntax
  claim: "A subscript part holds one, two or three subscripts; a numeric array element subscripted with four or more is rejected before the program runs."
  tests: [NUM-0008]
  external: []
  covers: [l.1678]

- id: A-5.2.3-EX
  clause: "5.2.3"
  ecma: "5.2.3"
  ecma_level: BASIC-1
  module: core
  kind: syntax
  claim: "The variable forms exemplified in section 5.2.3 (plain names such as X or sum, and array elements such as V(4) or table(i,j+1)) are all valid numeric-variable references."
  tests: [NUM-0009]
  external: []
  covers: [l.1681-1687]

- id: A-5.2.4-01
  clause: "5.2.4"
  ecma: "5.2.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A numeric variable belongs to the program-unit in which it appears; only a parameter of an internal function definition escapes that rule."
  tests: [NUM-0010]
  external: []
  covers: [l.1697]

- id: A-5.2.4-02
  clause: "5.2.4"
  ecma: "5.2.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Before an array element is selected, the subscript value is rounded to the nearest integer, defined as INT(X+0.5)."
  tests: [NUM-0011]
  external: []
  covers: [l.1700]

- id: A-5.2.4-03
  clause: "5.2.4"
  ecma: "5.2.4"
  ecma_level: BASIC-1
  module: core
  kind: syntax
  claim: "The bounds an array element must stay within are exactly those written in the array's DIM or DECLARE declaration."
  tests: [NUM-0012]
  external: []
  covers: [l.1707]

- id: A-5.2.5-EXC
  clause: "5.2.5"
  ecma: "5.2.5"
  ecma_level: BASIC-1
  module: core
  kind: exception
  claim: "Using a subscript outside the declared bounds of its array is reported as the fatal exception 2001 (EXTYPE 2001); the Table 9 entry is covered by E-2001."
  tests: [NUM-0013]
  external: []
  covers: [l.1708, l.1717]

- id: D-5.2-1
  clause: "5.2"
  ecma: "5.2"
  ecma_level: BASIC-1
  module: core
  kind: implementation-defined
  claim: "The value every numeric variable holds when execution starts (Appendix C, subsection 5.2) is chosen by the implementation."
  tests: [NUM-0014, ARR-0210, ARR-0211, ARR-0212, ARR-0213, ARR-0214]
  value: "Every numeric variable starts at 0; a read before any assignment also raises the nonfatal exception 3101 (EXTYPE 3101) and supplies 0. The same holds for an array element read by MAT PRINT, MAT PRINT USING, MAT WRITE or MAT GRAPH: the statement supplies 0, completes, and raises 3101 once (3102 for a string array)."
  external: []
  covers: [l.1712]

- id: E-3101
  clause: "5.2"
  ecma: "5.2"
  ecma_level: BASIC-1
  module: core
  kind: exception
  claim: "Reading a numeric variable before any value has been assigned to it may be reported as the nonfatal exception 3101 (EXTYPE 3101), supplying an implementation-defined value and continuing."
  tests: [NUM-0015]
  external: []
  covers: [l.1712, l.1730-1733, l.12847]

# --- 5.3 Numeric expressions
- id: A-5.3.2-01
  clause: "5.3.2"
  ecma: "5.3.2"
  ecma_level: BASIC-1
  module: core
  kind: syntax
  claim: "A call to a numeric function, whether defined by the program (DEF) or supplied by the implementation (ABS, SIN, MOD, MAX, LEN, POS, VAL, ...), must pass as many arguments, of the same types, as the function's definition or description declares; a mismatch in number or in type (a string where a number is required, or the reverse) is rejected before the program runs, even in a statement that would never execute."
  tests: [NUM-0016, NUM-0017, NUM-0117, NUM-0118, NUM-0119, NUM-0122]
  external: []
  covers: [l.1776]

- id: A-5.3.2-02
  clause: "5.3.2"
  ecma: "5.3.2"
  ecma_level: BASIC-1
  module: core
  kind: syntax
  claim: "An array passed as an actual argument must have as many dimensions as the matching formal parameter."
  tests: [NUM-0018]
  external: []
  covers: [l.1777]

- id: A-5.3.2-03
  clause: "5.3.2"
  ecma: "5.3.2"
  ecma_level: BASIC-1
  module: core
  kind: syntax
  claim: "Invoking an external function while the invoking program-unit has a different ARITHMETIC option in force than the function's own definition is rejected."
  tests: [NUM-0019]
  external: []
  covers: [l.1783]

- id: A-5.3.2-04
  clause: "5.3.2"
  ecma: "5.3.2"
  ecma_level: BASIC-1
  module: core
  kind: syntax
  claim: "A numeric function referenced in a program-unit must be either built in, or defined by an internal function definition or a DECLARE placed in an earlier line of the same program-unit before its first reference; otherwise the program is rejected before running."
  tests: [NUM-0020, NUM-0021]
  external: []
  covers: [l.1786]

- id: A-5.3.3-EX
  clause: "5.3.3"
  ecma: "5.3.3"
  ecma_level: BASIC-1
  module: core
  kind: syntax
  claim: "Every numeric expression exemplified in section 5.3.3 (the operators ~ * / + -, parentheses, function calls and array arguments) is accepted and evaluates with the precedence rules of section 5.3.4."
  tests: [NUM-0022]
  external: []
  covers: [l.1791-1803]

- id: A-5.3.4-01
  clause: "5.3.4"
  ecma: "5.3.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "In an expression, exponentiation (~) is applied before multiplication and division (* /), which are applied before addition, subtraction and unary negation (+ -)."
  tests: [NUM-0023]
  external: []
  covers: [l.1811]

- id: A-5.3.4-02
  clause: "5.3.4"
  ecma: "5.3.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Operators of equal precedence group from the left: A-B-C means (A-B)-C, A~B~C means (A~B)~C and A/B/C means (A/B)/C; unary minus binds less tightly than ~ but more tightly than +, so -A~B means -(A~B) while -A+B means (-A)+B."
  tests: [NUM-0024]
  external: []
  covers: [l.1814-1815]

- id: A-5.3.4-03
  clause: "5.3.4"
  ecma: "5.3.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "When an operation inside a numeric expression underflows, the value produced by that operation becomes zero."
  tests: [NUM-0025]
  external: []
  covers: [l.1826]

- id: A-5.3.4-04
  clause: "5.3.4"
  ecma: "5.3.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Calling a numeric function substitutes the actual argument values for the parameters of its definition."
  tests: [NUM-0026]
  external: []
  covers: [l.1832]

- id: A-5.3.4-05
  clause: "5.3.4"
  ecma: "5.3.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "The result of a numeric function call is a single scalar number that takes the place of the call within the surrounding expression."
  tests: [NUM-0027]
  external: []
  covers: [l.1835]

- id: E-3001
  clause: "5.3.5"
  ecma: "5.3.5"
  ecma_level: BASIC-1
  module: core
  kind: exception
  claim: "A division by zero occurring while a numeric expression is evaluated raises the fatal exception 3001 (EXTYPE 3001), which a handler can intercept."
  tests: [NUM-0028]
  external: []
  covers: [l.1841, l.12831]

- id: E-1002
  clause: "5.3.5"
  ecma: "5.3.5"
  ecma_level: BASIC-1
  module: core
  kind: exception
  claim: "An overflow occurring while a numeric expression is evaluated raises the fatal exception 1002 (EXTYPE 1002), which a handler can intercept."
  tests: [NUM-0029]
  external: []
  covers: [l.1844, l.12783]

- id: E-3002
  clause: "5.3.5"
  ecma: "5.3.5"
  ecma_level: BASIC-1
  module: core
  kind: exception
  claim: "Computing a negative base raised to a non-integer exponent raises the fatal exception 3002 (EXTYPE 3002), which a handler can intercept."
  tests: [NUM-0030]
  external: []
  covers: [l.1847, l.12832]

- id: E-3003
  clause: "5.3.5"
  ecma: "5.3.5"
  ecma_level: BASIC-1
  module: core
  kind: exception
  claim: "Computing zero raised to a negative exponent raises the fatal exception 3003 (EXTYPE 3003), which a handler can intercept."
  tests: [NUM-0031]
  external: []
  covers: [l.1851, l.12833]

- id: E-1502
  clause: "5.3"
  ecma: "5.3"
  ecma_level: BASIC-1
  module: core
  kind: exception
  claim: "An underflow during expression evaluation may additionally be reported as the nonfatal exception 1502 (EXTYPE 1502), replacing the produced value by zero and continuing."
  tests: [NUM-0032]
  external: []
  covers: [l.1826, l.1859-1861, l.12816]

- id: D-5.3-1
  clause: "5.3"
  ecma: "5.3"
  ecma_level: BASIC-1
  module: core
  kind: implementation-defined
  claim: "Beyond the fixed precedence and left-to-right grouping rules, the order in which the parts of a numeric expression are evaluated (Appendix C, subsection 5.3) is chosen by the implementation."
  tests: [NUM-0033]
  value: "Operands of an operator are evaluated right-to-left in source order (with a side-effecting internal FUNCTION INC, INC(0)*10+INC(0) yields 21, i.e. the right call is evaluated first); grouping itself stays left-to-right per 5.3.4."
  external: []
  covers: [l.1817-1820]

