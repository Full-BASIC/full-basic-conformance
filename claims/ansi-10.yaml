- id: A-10.3.4.1-06
  clause: "10.3.4.1"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Scaled form prints significand, letter E, sign and exponent; the significand lies in [1,10) with exactly d digits, the exponent uses one to e digits, and removable zeros may be dropped."
