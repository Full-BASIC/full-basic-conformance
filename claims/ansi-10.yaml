- id: A-10.3.3-EX
  clause: "10.3.3"
  ecma: "10.3.3"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Every PRINT, SET MARGIN and SET ZONEWIDTH form shown in the examples of section 10.3.3 is accepted and behaves as written."
