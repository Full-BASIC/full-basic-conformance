- id: A-10.3.4.1-07
  clause: "10.3.4.1"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Only a value that is exactly an integer prints without a period; a non-integer value whose rounding to d digits leaves no fraction still prints with an explicit period (3., 12345679.), unless it needs the scaled form."
  tests: [PRT-0262, PRT-0263]
  external: []
  covers: [l.5375, l.5379, l.5388]

- id: A-10.3.4.2-01
  clause: "10.3.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A string item of a print-list is printed as the string its expression evaluates to."
