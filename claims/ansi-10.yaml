  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "An input-reply whose final non-space character is a comma continues on another reply, even when spaces follow that comma: INPUT and MAT INPUT assign the values read so far and ask for another reply. A comma inside a quoted string is not a continuation."
  tests: [PRT-0406]
  covers: [l.5208-5219]
  external: []

