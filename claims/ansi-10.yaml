  module: core
  kind: semantics
  claim: "The format-string is scanned from left to right and at each point the longest syntactically correct format-item is taken, the next search starting right after it. Format-items written one against the other are therefore separate fields: \"##-##-####\" is \"##\", \"-##\" and \"-####\" (12, 5, 1983 print as 12  5 1983), \"#.#.#\" is \"#.#\" and \".#\", and \"##$##\" is \"##\" and \"$##\". A comma, sign, dollar sign or period left over after a format-item is not a literal-item (production 8 of 10.4.2 lists them closed), so the format-string is invalid (8201, fatal), as is an e-format with one or two circumflex accents."
  tests: [PRT-0397, PRT-0398, PRT-0399, PRT-0400, PRT-0401]
  covers: [l.5677-5692]
  external: []

- id: A-10.4.4.3-TR175
  clause: "10.4.4.3"
  ecma: "10.4.4.3"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "With floating-characters that start with a plus-sign and end with a dollar-sign the leading characters are \"+$\" for a non-negative value and \"-$\" for a negative one, with no space before them: \"+$##.##\" prints 12.5 as +$12.50 and -12.5 as -$12.50, and \"+$###.##\" prints 1.5 as +$  1.50. With two plus-signs (\"++$##\") the extra plus-sign provides the room and the output is the same two rows, right-justified in the field."
  tests: [PRT-0402, PRT-0403]
  covers: [l.5767-5787]
  external: []

- id: A-10.2.4.2-CL11
  clause: "10.2.4.2"
