  clause: "10.3.4.1"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Plain decimal form carries up to d significant digits and a period; trailing zeros of the fraction may be dropped, and a magnitude below 1 prints no digit left of the period."
