# Claims for chapter 10 (input and output).
- id: E-4005
  clause: "10.3.5"
  ecma: "10.3.5"
  ecma_level: BASIC-1
  module: core
  kind: exception
  claim: "A TAB whose index is less than one raises the nonfatal exception 4005 with the index replaced by one; without a handler the report names the code and line and execution continues, and a handler can intercept it."
  tests: [PRT-0001, PRT-0002]
  covers: [l.5532, l.12856]
  external: []

- id: A-10.1.2-01
  clause: "10.1.2"
  ecma: "10.1.2"
  ecma_level: BASIC-1
  module: core
  kind: syntax
  claim: "An IF MISSING recovery of EXIT DO (or EXIT FOR) on a READ is only valid inside a DO (or FOR) loop, so otherwise the program is rejected before it runs."
  tests: [PRT-0003]
  covers: [l.4974, l.4976]
  external: []

- id: A-10.3.4.3-01
  clause: "10.3.4.3"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A comma separator evaluated in the last print zone of a line generates an end-of-line, so the next print item starts a new line. The runner ignores trailing blanks, so this program fixes the line break, not the absence of padding after the last item."
  tests: [PRT-0004]
  covers: [l.5474-5476]
  external: []

- id: A-10.4.2-01
  clause: "10.4.2"
  ecma: "10.4.2"
  ecma_level: BASIC-1
  module: core
  kind: syntax
  claim: "A PRINT USING whose format is given by line number may only name an IMAGE line that belongs to the program-unit containing the statement, so naming one that lives in a different program-unit is rejected before the program runs."
  tests: [PRT-0005, PRT-0006]
  covers: [l.5621]
  external: []
- id: A-10.4.2-02
  clause: "10.4.2"
  ecma: "10.4.2"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A PRINT USING that names an IMAGE line of its own program-unit (the main program, an internal subprogram of it, or an external subprogram) uses that line as its format."
  tests: [PRT-0007]
  external: []
- id: A-10.4.2-03
  clause: "10.4.2"
  ecma: "10.4.2"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A PRINT USING may name an IMAGE line that follows it in the same program-unit; the standard imposes no order between the two, and this holds inside external subprograms and external functions as well as in the main program."
  tests: [PRT-0008]
  external: []

# 10.1.2 - 10.1.4 (READ, DATA, RESTORE)
- id: A-10.1.2-02
  clause: "10.1.2"
  ecma: "10.1.2"
  ecma_level: BASIC-1
  module: core
  kind: syntax
  claim: "A line number after RESTORE must point at a line that holds a DATA statement; any other target is rejected before the program runs."
  status: claimed
  tests: [PRT-0009]
  external: []
  covers: [l.4979]

- id: A-10.1.3-EX
  clause: "10.1.3"
  ecma: "10.1.3"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Every READ, IF MISSING and RESTORE form shown in the examples of section 10.1.3 is accepted and behaves as written."
  tests: [PRT-0010]
  external: []
  covers: [l.4981-4995]

- id: A-10.1.4-01
  clause: "10.1.4"
  ecma: "10.1.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "All DATA statements of a program unit form a single data sequence in textual order, and reaching a DATA line at run time just moves execution to the next line."
  tests: [PRT-0011]
  external: []
  covers: [l.4999, l.5005]

- id: A-10.1.4-02
  clause: "10.1.4"
  ecma: "10.1.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A READ assigns the listed variables, left to right, from the data sequence of its unit through a pointer that starts at the first datum and steps past each datum consumed."
  tests: [PRT-0012]
  external: []
  covers: [l.5008]

- id: A-10.1.4-03
  clause: "10.1.4"
  ecma: "10.1.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Reading past the end of the data sequence raises an exception unless the READ carries IF MISSING; then the chosen action runs: EXIT DO or EXIT FOR behaves normally, and a line number transfers execution to that line."
  tests: [PRT-0013, PRT-0014, PRT-0015]
  external: []
  covers: [l.5019, l.5021-5024]

- id: A-10.1.4-04
  clause: "10.1.4"
  ecma: "10.1.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Each datum must match its variable's type: numeric constants for numeric variables, string constants or unquoted strings for string variables; an unquoted string that also parses as a number may fill either kind."
  tests: [PRT-0016]
  external: []
  covers: [l.5027]

- id: A-10.1.4-05
  clause: "10.1.4"
  ecma: "10.1.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A numeric datum that underflows while being evaluated is stored as zero."
  tests: [PRT-0017]
  external: []
  covers: [l.5036]

- id: A-10.1.4-06
  clause: "10.1.4"
  ecma: "10.1.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Subscripts and substring qualifiers in a READ list are worked out only after the variables to their left already received their values."
  tests: [PRT-0018]
  external: []
  covers: [l.5039]

- id: A-10.1.4-07
  clause: "10.1.4"
  ecma: "10.1.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "RESTORE rewinds the data pointer of its unit to the first datum, or, with a line number, to the first datum of that DATA line, so the next READ starts there."
  tests: [PRT-0019]
  external: []
  covers: [l.5046, l.5051]

- id: A-10.1.4-08
  clause: "10.1.4"
  ecma: "10.1.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "The textual order of the data sequence of a program unit also interleaves the DATA statements of its internal subprograms and internal functions by line position; they are not appended after the data of the main body."
  tests: [SEG-0318, SEG-0319]
  external: []
  covers: [l.4997-5001]

# 10.2 (INPUT, LINE INPUT)
- id: A-10.2.2-01
  clause: "10.2.2"
  ecma: "10.2.2"
  ecma_level: BASIC-1
  module: core
  kind: syntax
  claim: "An input-modifier-list may hold at most one PROMPT, one TIMEOUT and one ELAPSED, in any order."
  status: claimed
  tests: [PRT-0026]
  external: []
  covers: [l.5123]

- id: A-10.2.3-EX
  clause: "10.2.3"
  ecma: "10.2.3"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Every INPUT and LINE INPUT form shown in the examples of section 10.2.3 is accepted and behaves as written."
  tests: [PRT-0027]
  external: []
  covers: [l.5126-5139]

- id: A-10.2.4-01
  clause: "10.2.4"
  ecma: "10.2.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "An INPUT halts the program until a valid input-reply arrives, then assigns the listed variables, left to right, from that reply."
  tests: [PRT-0028]
  external: []
  covers: [l.5142, l.5144]

- id: A-10.2.4-02
  clause: "10.2.4"
  ecma: "10.2.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "In interactive mode the program must show an input-prompt telling the user that data are needed."
  status: pending
  tests: []
  note: "Not observable from FBCS: the runner gives every program a file as stdin, so the program is never in interactive mode (10.2.4 l.5147-5149 applies only there) and no terminal can be driven. The prompt text is implementation-defined (10.2.2 l.5119; recommended '? ', 10.2.6 l.5278-5280) and is recorded as D-10.2-1."
  external: []
  covers: [l.5148]

- id: A-10.2.4.1-01
  clause: "10.2.4.1"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "With a PROMPT specifier the built-in prompt is suppressed and the given string is printed instead, unless the reply ends with a comma."
  tests: [PRT-0029]
  external: []
  covers: [l.5156-5157]

- id: A-10.2.4.1-02
  clause: "10.2.4.1"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A TIMEOUT expression is evaluated to a number S of seconds; if no valid reply arrives within S an exception occurs, and ELAPSED stores the seconds elapsed between the prompt and the end-of-line of the last reply."
  tests: [PRT-0030]
  external: []
  covers: [l.5163, l.5166]

- id: A-10.2.4.1-03
  clause: "10.2.4.1"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Without a clock, TIMEOUT does nothing and ELAPSED yields -1; with a clock, an ELAPSED result is always positive."
  tests: [PRT-0031]
  external: []
  covers: [l.5172-5174]

- id: A-10.2.4.1-TR84
  clause: "10.2.4.1"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "The numeric-variable of a time-inquiry may be an array element (also with a variable subscript or in two dimensions): ELAPSED E(2) in INPUT, LINE INPUT, MAT INPUT and MAT LINE INPUT assigns the positive time to that element and leaves the other elements unchanged."
  tests: [PRT-0260]
  note: "10.2.2 production 7 (time-inquiry = ELAPSED numeric-variable) with numeric-variable including the array element (Appendix E); 10.2.4.1 l.5166-5176 assigns the value to the numeric-variable."
  external: []
  covers: [l.5166-5176]

- id: A-10.2.4.2-01
  clause: "10.2.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Each variable receives its value as soon as the corresponding reply datum passes the type and range checks."
  status: claimed
  tests: [PRT-0032]
  external: []
  covers: [l.5181]

- id: A-10.2.4.2-02
  clause: "10.2.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Subscripts and substring qualifiers in an INPUT list are evaluated only after the variables to their left received their values."
  tests: [PRT-0033]
  external: []
  covers: [l.5187]

- id: A-10.2.4.2-03
  clause: "10.2.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "Reply data must match variable types: numeric constants for numeric variables, quoted or unquoted strings for string variables; an unquoted string that also parses as a number may fill either."
  tests: [PRT-0034]
  external: []
  covers: [l.5192, l.5194-5195]

- id: A-10.2.4.2-04
  clause: "10.2.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A numeric input datum that underflows is stored as zero."
  tests: [PRT-0035]
  external: []
  covers: [l.5201]

- id: A-10.2.4.2-05
  clause: "10.2.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "When no reply ends with a comma, the total number of data across all replies must equal the number of variables."
  tests: [PRT-0036]
  external: []
  covers: [l.5205]

- id: A-10.2.4.2-06
  clause: "10.2.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A comma as the last non-blank character of a reply means more data follow: the values present are assigned, the built-in prompt is shown again (not a PROMPT string), and the program waits for the next reply."
  tests: [PRT-0037]
  external: []
  covers: [l.5209, l.5211, l.5213-5216]

- id: A-10.2.4.2-07
  clause: "10.2.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "LINE INPUT asks for one whole line per string variable: the first line goes to the first variable, the prompt is reissued for each further variable, until every variable got a line."
  tests: [PRT-0038]
  external: []
  covers: [l.5219, l.5221, l.5225]

- id: A-10.2.4.2-08
  clause: "10.2.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "A line reply is stored verbatim, keeping leading and trailing spaces but dropping the end-of-line; quote characters inside are literal, so two adjacent quotes stay two characters."
  tests: [PRT-0039]
  external: []
  covers: [l.5231-5232, l.5234]

- id: A-10.2.4.2-09
  clause: "10.2.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "When INPUT (or INPUT #0) raises 8002, 8103 or 1007 after earlier data of the same input-reply were validated, those data remain assigned to their variables; the exception is raised after them."
  status: claimed
  tests: [PRT-0144, PRT-0145, PRT-0146, PRT-0149, PRT-0152]
  external: []
  covers: [l.5181-5183, l.5245-5246, l.5249-5250, l.5256-5257]

- id: A-10.2.4.2-10
  clause: "10.2.4.2"
  ecma: null
  ecma_level: BASIC-1
  module: core
  kind: exception
  claim: "When an input-reply ending in a comma is continued by further replies, the total number of data must equal the number of variables; extra data raise nonfatal 8003 after the variables were assigned."
  status: claimed
  tests: [PRT-0154]
  external: []
  covers: [l.5203-5205, l.5181-5183]

# 10.3 (PRINT, SET, ASK)
- id: A-10.3.2-01
  clause: "10.3.2"
  ecma: "10.3.2"
  ecma_level: BASIC-1
  module: core
