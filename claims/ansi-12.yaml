- id: A-12.1.4-CL13
  clause: "12.1.4"
  ecma: "12.1.4"
  ecma_level: BASIC-2
  module: core
  kind: semantics
  claim: "An exception raised in a GOSUB or ON GOSUB subroutine called from inside a when-block is not propagated, because a GOSUB subroutine is part of the same block and not a procedure-part or an internal-proc-def: the handler sees the original EXTYPE (3001 for a division by zero), without 100000 added, and EXLINE is the line whose execution caused the exception. RETRY and CONTINUE in that handler resume inside the subroutine (the line again, or the next one) and its RETURN returns after the GOSUB; a handler that ends at END WHEN or EXIT HANDLER leaves no GOSUB frame pending. Procedure-parts and internal-proc-defs (SUB, FUNCTION, DEF, PICTURE) still add 100000 once, or -100000 for a negative EXTYPE."
  tests: [EXC-0244, EXC-0245, EXC-0246, EXC-0247, EXC-0248, EXC-0249, EXC-0250, EXC-0251, EXC-0252, EXC-0253, EXC-0254, EXC-0255, EXC-0256, EXC-0257, EXC-0258, EXC-0259]
  covers: [l.8877-8905, l.8913-8917, l.8808-8814, l.8820-8851]
  external: []
