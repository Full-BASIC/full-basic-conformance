  ecma: "12.2.4"
  ecma_level: BASIC-1
  module: core
  kind: semantics
  claim: "With tracing on, an exception raised in an external procedure without debugging and handled by the exception-handler of the calling unit is reported by the calling unit as the line of its CALL together with the first line of the handler; and when the first line of the handler is a remark-line, that line is reported as the next line to be executed, for a handler in line and for a detached handler."
