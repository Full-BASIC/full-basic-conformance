- id: D-12.1-1
  clause: "12.1"
  ecma: "12.1"
  ecma_level: BASIC-2
  module: core
  kind: implementation-defined
  claim: "Which EXTYPE value a local enhancement assigns to each of its own exceptions (Appendix C, subsection 12.1 item 1)."
  tests: [EXC-0060]
  value: "Negative EXTYPE values identify local-enhancement exceptions: this implementation uses -99000, -99001, -99004 and -99993 for its internal errors; when such a value is propagated out of a procedure it becomes -100000 plus the original value (e.g. -100042 for -42)."
  external: []
  covers: [l.8914-8915]

- id: D-12.1-2
  clause: "12.1"
  ecma: "12.1"
  ecma_level: BASIC-2
  module: core
  kind: implementation-defined
  claim: "The precise format of the string that EXTEXT$ returns (Appendix C, subsection 12.1 item 2)."
  tests: [EXC-0061]
  value: "EXTEXT$(n) rounds n to an integer and returns the Table 9 message text in the form description plus parenthesized clause list, e.g. EXTEXT$(1001) is the string Overflow in evaluating numeric-constant (5.1, 15.1); for a number that is not a standard system exception (e.g. 2002) it returns the null string. The real-time codes of Table 9 (1201-1204, 4201-4204, 6301, 12001-12007, 12101-12103, 12201) also return the null string, because the real-time module is not implemented (A-14-01)."
  external: []
  covers: [l.9039-9040]

- id: D-12.2-1
  clause: "12.2"
  ecma: "12.2"
  ecma_level: BASIC-1
  module: core
  kind: implementation-defined
  claim: "What the debugging system allows the user to do at a break point, including how execution continues or ends (Appendix C, subsection 12.2 item 1)."
  tests: [EXC-0062]
  value: "No interactive debugger in the CLI: an uncaught BREAK with debugging active prints a Warning 10007 line report and continues with the next line (exit 0); 10007 is nonfatal and may be caught in a WHEN block, where CONTINUE or RETRY resumes execution."
  external: []
  covers: [l.9095-9101]

- id: D-12.2-2
  clause: "12.2"
  ecma: "12.2"
  ecma_level: BASIC-1
  module: core
  kind: implementation-defined
  claim: "The exact form of the trace reports (Appendix C, subsection 12.2 item 2)."
  tests: [EXC-0063, EXC-0081, EXC-0082, EXC-0265]
  value: "Each trace report is a single line [TRACE] followed by the line number and the source text of that line, sent to the channel named in TRACE ... TO or to channel zero, e.g. [TRACE] 130 LET A = 42. A TRACE statement without channel-expression also writes 'Trace mode ON'/'Trace mode OFF' on channel zero; with TO #ch the reports go to that file (§12.2.4 l.9132-9136 fixes the destination; only the content is implementation-defined, l.9138) and no mode message is written to channel zero (decision of the project owner, 2026-11-03). The required reports have their own line: a control transfer as [TRACE] A -> B and the assignments of a line as [TRACE] N name=value, with the evaluated subscripts of an array element (C(3)=5), every element of a MAT assignment and string values in quotes; the name is spelled as it appears in the statement that assigns it (LET w = 20 reports w=20; §12.2.4 l.9125-9131)."
  external: []
  covers: [l.9132-9136, l.9138-9142, l.9164]

- id: A-12.1.2-TR94
  clause: "12.1.2"
  ecma: "12.1.2"
  ecma_level: BASIC-2
  module: core
