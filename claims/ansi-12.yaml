  claim: "When line-numbers are repeated between program-units (4.2.2), the trace identifies a line by its program-unit: the transfer from the END SUB of line 40 of an external unit to line 40 of the calling program is reported (40 -> 40) and the line that follows it is traced, and the report of a line shows the text of that line in its own unit, not that of a line with the same number in another unit."
