  external: []
  covers: [l.8688-8692]

- id: A-12.1.4-TR128
  clause: "12.1.4"
  ecma: "12.1.4"
  ecma_level: BASIC-2
  module: core
  kind: semantics
  claim: "A detached-handler of an EXTERNAL SUB, FUNCTION or PICTURE is part of that program unit and behaves as an exception-handler in its when-use-block: it sees and assigns the parameters of the unit (numeric, string and array, by reference), a function-let in it gives the value of the FUNCTION, and RESTORE n in it may name a DATA line of the unit; a RESTORE n that names a DATA line of another program unit is rejected before the program runs."
  tests: [PRT-0314, PRT-0315, SEG-0501, SEG-0502, SEG-0503]
  external: []
  covers: [l.8805-8807, l.5043-5052, l.4978-4979, l.4718-4723, l.4228-4231]

- id: A-12.1.4-TR130
  clause: "12.1.4"
  ecma: "12.1.4"
  ecma_level: BASIC-2
  module: core
  kind: semantics
  claim: "A detached-handler is part of the program unit that contains it: in an EXTERNAL unit its variables are variables of that unit, even when the unit has no parameters (not those of the main program or of another unit); the handler of an internal SUB or FUNCTION sees the parameters of the routine and of its unit, and a function-let in it is a function-let of the FUNCTION, which for an EXTERNAL or internal FUNCTION may be its only one; an IMAGE line or a DIM in the handler of an EXTERNAL unit belongs to that unit and may be used by its body."
  tests: [SEG-0504, SEG-0505, SEG-0506, SEG-0507, PRT-0316, ARR-0316]
  external: []
  covers: [l.8805-8807, l.8708-8710, l.4228-4231, l.2437-2441, l.5621-5622, l.2996-2999, l.1498-1509]

- id: A-12.1.4-TR131
  clause: "12.1.4"
  ecma: "12.1.4"
  ecma_level: BASIC-2
  module: core
  kind: semantics
  claim: "EXIT SUB in an exception-handler of a SUB (in-line use-part or detached handler, EXTERNAL or internal SUB) ends the invocation of the SUB: the separate GOSUB stack of the handler is only for RETURN, and EXIT SUB is not a RETURN. When a handler calls a routine that handles an exception of its own, EXTYPE and EXLINE (and the GOSUB stack) of the calling handler are those of the exception that made it run, when control comes back to it."
  tests: [SEG-0508, SEG-0509, SEG-0510, EXC-0211, EXC-0212, EXC-0213]
  external: []
  covers: [l.8864-8866, l.8809-8815, l.4539-4540, l.4622-4627]

- id: A-12.1.4-TR133
  clause: "12.1.4"
  ecma: "12.1.4"
  ecma_level: BASIC-2
  module: core
  kind: semantics
  claim: "An EXIT PICTURE in a detached-handler of a PICTURE (EXTERNAL, or internal to the main program or to an EXTERNAL unit) occurs within the picture-def, since the handler is part of the program unit that contains it, and ends the picture. In the detached-handler of a SUB or of the main program it is still rejected."
  tests: [GFX-0187, GFX-0188]
  external: []
  covers: [l.10532-10533, l.8805-8807]

- id: A-12.2.4-TR134
